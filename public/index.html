<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>StreetLightsMasterHtml</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- Зареждаме общото меню -->
    <script src="js/menu.js"></script>
    <style>
        /* Скриваме автоматично инжектираното меню при първо зареждане */
        #mainMenu { display: none; }
        
        .login-box { max-width: 400px; margin: 100px auto; padding: 25px; border: 1px solid #0056b3; background: #fff; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #0056b3; }
        .form-group select, .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; }
        .status-msg { margin-top: 15px; font-weight: bold; text-align: center; }
        .welcome-panel { display: none; max-width: 600px; margin: 50px auto; padding: 30px; border: 1px dashed #0056b3; background: #f9fbfd; text-align: center; }
        h2, h3 { text-align: center; margin-top: 0; color: #333; }
    </style>
</head>
<body>

<!-- КОНТЕНЕРУТ ЗА ВХОД -->
<div id="loginSection" class="login-box">
    <h2>Улично Осветление</h2>
    <h3>Вход в системата</h3>
    
    <div class="form-group">
        <label for="operatorSelect">Оператор:</label>
        <select id="operatorSelect">
            <option value="">Зареждане на оператори...</option>
        </select>
    </div>

    <div class="form-group">
        <label for="passwordInput">Парола:</label>
        <input type="password" id="passwordInput" placeholder="Въведете парола">
    </div>

    <button id="loginBtn" class="btn-sync" style="width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; cursor: pointer;">Влизане</button>
    <div id="statusMessage" class="status-msg"></div>
</div>

<!-- РАБОТЕН ЕКРАН СЛЕД УСПЕШЕН ВХОД -->
<div id="welcomeSection" class="welcome-panel">
    <h2 style="color: #0056b3;">Добре дошли в Централния Пулт за Управление</h2>
    <p id="welcomeText" style="font-size: 18px; font-weight: bold;"></p>
    <p>Използвайте горната навигационна лента, за да управлявате системата и да разглеждате отчетите.</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const errorParam = urlParams.get('error');
    const statusMsg = document.getElementById('statusMessage');
    
    if (errorParam === 'no_rights') {
        statusMsg.textContent = '❌ Достъпът е забранен! Нямате административни права.';
        statusMsg.style.color = 'red';
    } else if (errorParam === 'no_connection') {
        statusMsg.textContent = '⚠️ Няма връзка с MySQL! Настройте сървъра локално.';
        statusMsg.style.color = 'orange';
    }

    // Проверяваме статуса на базата данни
    fetch('/api/db-status')
        .then(res => res.json())
        .then(status => {
            if (status.online) {
                // Базата е онлайн - пълним менюто с оператори
                fetch('/api/operators')
                    .then(res => res.json())
                    .then(data => {
                        const select = document.getElementById('operatorSelect');
                        select.innerHTML = '<option value="">-- Изберете оператор --</option>';
                        data.forEach(op => {
                            const opt = document.createElement('option');
                            opt.value = op.id_operator;
                            opt.textContent = `${op.name_operator}`;
                            select.appendChild(opt);
                        });
                    });
            } else {
                // Авария: няма база, пренасочваме директно към конфигурацията
                window.location.href = 'settings/db_config.html';
            }
        });
});

// Логика за натискане на бутона "Влизане"
document.getElementById('loginBtn').addEventListener('click', () => {
    const id = document.getElementById('operatorSelect').value;
    const password = document.getElementById('passwordInput').value;
    const statusMsg = document.getElementById('statusMessage');

    if (!id) {
        statusMsg.textContent = 'Моля, изберете оператор!';
        statusMsg.style.color = 'orange';
        return;
    }

    fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_operator: id, password: password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            // УСПЕШЕН ВХОД: Изпълняваме преобразяването на прозореца!
            document.getElementById('loginSection').style.display = 'none'; // Скриваме логина
            document.getElementById('welcomeSection').style.display = 'block'; // Показваме работния екран
            document.getElementById('welcomeText').textContent = `Оператор: ${data.name} (Ниво на привилегия: ${data.privilege})`;
            
            // Показваме голямото синьо меню най-отгоре на екрана!
            document.getElementById('mainMenu').style.display = 'block';
        } else {
            statusMsg.textContent = data.message;
            statusMsg.style.color = 'red';
        }
    });
});
</script>
</body>
</html>
