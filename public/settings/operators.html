<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Управление на оператори</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/menu.js"></script>
    <style>
        .container {max-width: 600px;}
        .window-layout { display: flex; gap: 20px; }
        .table-side { flex: 1; min-width: 0; }
        .buttons-side { width: 150px; display: flex; flex-direction: column; gap: 10px; justify-content: flex-start; }
        
        /* ТАБЛИЦА */
        /* за да не се примачква с бутоните при свиване */
        .table-side { 
            flex: 1; 
            min-width: 0; 
            overflow-x: auto; /* ТОВА СПАСЯВА БУТОНИТЕ ОТ ЗАКРИВАНЕ */
        }
        
        .btn-mfc { padding: 6px; font-weight: bold; cursor: pointer; text-align: center; }
        .editor-panel { display: none; margin-top: 20px; padding: 15px; border: 1px dashed #0056b3; background: #f9fbfd; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 3px; color: #0056b3; }
        .form-group input, .form-group select { width: 100%; padding: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>👤 Списък с Оператори</h2>
    <hr style="border-color: #0056b3; margin-bottom: 15px;">

    <div class="window-layout">
        <!-- ЛЯВА СТРАНА: ТАБЛИЦАТА С ОПЕРАТОРИТЕ (Аналог на CListCtrl) -->
        <div class="table-side">
            <table class="grid-table" id="opsTable">
                <thead>
                    <tr>
                        <th style="width: 50%;"><div onclick="sortTable(0)">Име <span id="sortIcon0">↕</span></div><div class="resizer"></div></th>
                        <th style="width: 50%;"><div onclick="sortTable(1)">Правомощия <span id="sortIcon1">↕</span></div><div class="resizer"></div></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Тук ще легнат редовете -->
                </tbody>
            </table>
        </div>

        <!-- ДЯСНА СТРАНА: БУТОНИТЕ ОТ КАРТИНКАТА (БЕЗ ПЕЧАТ!) -->
        <div class="buttons-side">
            <button id="newBtn" class="btn-mfc btn-sync" style="background-color: #28a745; color: white; border: none;">Нов</button>
            <button id="deleteBtn" class="btn-mfc" style="background-color: #d9534f; color: white; border: none;" disabled>Изтрий</button>
            <hr style="width: 100%; border-color: #ccc; margin: 5px 0;">
            <button id="cancelBtn" class="btn-mfc" style="background-color: #ccc; border: 1px solid #aaa;">Изход</button>
        </div>
    </div>

    <!-- СКРИТ ПАНЕЛ ЗА СЪЗДАВАНЕ НА НОВ ОПЕРАТОР -->
    <div id="editorPanel" class="editor-panel">
        <h4 style="margin-top:0; color:#0056b3;">Добавяне на нов потребител</h4>
        <div class="form-group">
            <label>Име на оператора (макс 24 знака):</label>
            <input type="text" id="opName" maxlength="24" placeholder="Въведете име">
        </div>
        <div class="form-group">
            <label>Парола:</label>
            <input type="password" id="opPass" placeholder="Въведете парола">
        </div>
        <div class="form-group">
            <label>Правомощия (Ниво):</label>
            <select id="opPrivilege">
                <option value="0">Операторски (Ниво 0)</option>
                <option value="1">Сервизни (Ниво 1)</option>
                <option value="2">Административни (Ниво 2)</option>
            </select>
        </div>
        <button id="saveBtn" class="btn-sync" style="padding: 6px 15px; background-color: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold;">Запиши в MySQL</button>
    </div>
</div>

<script>
let operatorsData = [];
let selectedOperatorId = null;
let sortDirections = [false, false];

document.addEventListener('DOMContentLoaded', loadOperators);

function loadOperators() {
    fetch('/api/mysql/operators-list')
        .then(res => res.json())
        .then(data => {
            operatorsData = data;
            renderTable(operatorsData);
            initResizableColumns();
        })
        .catch(() => {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="2" style="color:red; text-align:center; font-weight:bold;">Нямате достъп до този диалог!</td></tr>';
        });
}

function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    data.forEach(row => {
        const tr = document.createElement('tr');
        tr.dataset.id = row.id_operator;
        tr.innerHTML = `<td>${row.name_operator}</td><td>${row.privilege_text}</td>`;
        
        // Клик за маркиране на ред (Селекция като в MFC)
        tr.addEventListener('click', () => {
            document.querySelectorAll('#opsTable tbody tr').forEach(r => r.classList.remove('selected'));
            tr.classList.add('selected');
            selectedOperatorId = row.id_operator;
            document.getElementById('deleteBtn').disabled = false; // Отключваме бутона Изтрий
        });
        tbody.appendChild(tr);
    });
}

// Показване на панела за нов оператор
document.getElementById('newBtn').addEventListener('click', () => {
    document.getElementById('editorPanel').style.display = 'block';
    document.getElementById('opName').focus();
});

// Записване на нов оператор
document.getElementById('saveBtn').addEventListener('click', () => {
    const name = document.getElementById('opName').value.trim();
    const password = document.getElementById('opPass').value;
    const privilege = document.getElementById('opPrivilege').value;

    if (!name || !password) return alert('Името и паролата са задължителни!');

    let idPC = localStorage.getItem('id_pc') || '0';

    fetch('/api/mysql/operators-add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, password, privilege, idPC })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if (data.success) {
            document.getElementById('editorPanel').style.display = 'none';
            document.getElementById('opName').value = '';
            document.getElementById('opPass').value = '';
            loadOperators();
        }
    });
});

// Изтриване на селектиран оператор
document.getElementById('deleteBtn').addEventListener('click', () => {
    if (!selectedOperatorId) return;
    if (!confirm('Сигурни ли сте, че искате да ИЗТРИЕТЕ маркирания оператор?')) return;

    let idPC = localStorage.getItem('id_pc') || '0';

    fetch('/api/mysql/operators-delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_operator: selectedOperatorId, idPC })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if (data.success) {
            selectedOperatorId = null;
            document.getElementById('deleteBtn').disabled = true;
            loadOperators();
        }
    });
});

// Сортиране на колоните
function sortTable(idx) {
    sortDirections[idx] = !sortDirections[idx];
    const isAsc = sortDirections[idx];
    
    document.getElementById('sortIcon0').textContent = '↕';
    document.getElementById('sortIcon1').textContent = '↕';
    document.getElementById(`sortIcon${idx}`).textContent = isAsc ? '▲' : '▼';

    operatorsData.sort((a, b) => {
        let valA = idx === 0 ? a.name_operator.toLowerCase() : a.privilege_text.toLowerCase();
        let valB = idx === 0 ? b.name_operator.toLowerCase() : b.privilege_text.toLowerCase();
        return valA < valB ? (isAsc ? -1 : 1) : (valA > valB ? (isAsc ? 1 : -1) : 0);
    });
    renderTable(operatorsData);
}

// Преоразмеряване
function initResizableColumns() {
    const table = document.getElementById('opsTable');
    const cols = table.querySelectorAll('th');
    cols.forEach(col => {
        const resizer = col.querySelector('.resizer');
        if (!resizer) return;
        let startX, startWidth;
        resizer.addEventListener('mousedown', (e) => {
            e.preventDefault(); e.stopPropagation();
            startX = e.pageX; startWidth = col.offsetWidth;
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
        function onMouseMove(e) {
            const width = startWidth + (e.pageX - startX);
            if (width > 80) col.style.width = width + 'px';
        }
        function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
    });
}

document.getElementById('cancelBtn').addEventListener('click', () => { window.location.href = '../index.html'; });
</script>
</body>
</html>
