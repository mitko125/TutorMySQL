<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Настройки на база данни</title>
    <link rel="stylesheet" href="../css/main.css"> <!-- Две точки отпред, защото сме в подпапка! -->
    <style>
        .container { max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #0056b3; background: #fff; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #0056b3; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        h2 { color: #333; margin-top: 0; text-align: center; }
        .nav-links { margin-top: 20px; text-align: center; }
        .nav-links a { color: #0056b3; text-decoration: none; font-weight: bold; }
    </style>
    <script src="../js/menu.js"></script>
</head>
<body>

<div class="container">
    <h2 id="panelTitle">⚙️ Настройки на MySQL връзката</h2>
    <hr style="border-color: #0056b3;">
    
    <div class="form-group">
        <label>IP Адрес (Host):</label>
        <input type="text" id="dbHost">
    </div>
    <div class="form-group">
        <label>Потребител (User):</label>
        <input type="text" id="dbUser">
    </div>
    <div class="form-group">
        <label>Парола (Password):</label>
        <input type="password" id="dbPass" placeholder="Въведете парола, ако има">
    </div>
    <div class="form-group">
        <label>База данни (DB Name):</label>
        <input type="text" id="dbName">
    </div>
    
    <button id="saveConfigBtn" class="btn-sync" style="width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; cursor: pointer;">Приложи настройките</button>

    <div class="nav-links">
        <a href="../index.html">← Обратно към Вход</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Вземаме текущите настройки от бакенда, за да попълним кутиите
    fetch('/api/db-status')
        .then(res => res.json())
        .then(status => {
            if (status.config) {
                document.getElementById('dbHost').value = status.config.host;
                document.getElementById('dbUser').value = status.config.user;
                document.getElementById('dbName').value = status.config.database;
            }

            if (!status.online) {
                document.getElementById('panelTitle').textContent = '🚨 Авариен режим: Настройка на MySQL';
                document.getElementById('saveConfigBtn').textContent = 'Тествай и приложи връзката (Временно)';
            } else {
                document.getElementById('panelTitle').textContent = '🔐 Административен панел (Ниво 2)';
                document.getElementById('saveConfigBtn').textContent = 'Запиши на ДИСКА перманентно';
            }
        });
});

document.getElementById('saveConfigBtn').addEventListener('click', () => {
    const host = document.getElementById('dbHost').value;
    const user = document.getElementById('dbUser').value;
    const password = document.getElementById('dbPass').value;
    const database = document.getElementById('dbName').value;
    const btnText = document.getElementById('saveConfigBtn').textContent;

    const endpoint = (btnText === 'Запиши на ДИСКА перманентно') ? '/api/mysql/save' : '/api/mysql/test';
    
    fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host, user, password, database })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        window.location.reload(); // Презареждаме страницата, за да се види новия статус
        // Ако бакендът е изчистил сесията заради новата база, го пращаме на входа кротко
        if (data.requiresLogin) {
            window.location.href = '../index.html';
        } else {
            window.location.reload(); // За временния тест просто презареждаме
        }
    });
});
</script>
</body>
</html>
