<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Номер работно място</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/menu.js"></script>
    <style>
        .station-box { max-width: 380px; margin: 80px auto; padding: 20px; border: 1px solid #0056b3; background: #fff; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .form-inline { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
        .form-inline input { flex: 1; padding: 6px; box-sizing: border-box; font-size: 16px; font-weight: bold; text-align: center; }
        .btn-inline { padding: 6px 15px; min-width: 80px; cursor: pointer; }
        .info-text { font-size: 13px; color: #333; margin-top: 15px; line-height: 1.4; }
        h3 { margin-top: 0; color: #0056b3; font-size: 16px; }
    </style>
</head>
<body>

<div class="station-box">
    <h3>Въведете номер работно място</h3>
    <hr style="border-color: #0056b3; margin-bottom: 15px;">
    
    <div class="form-inline">
        <!-- По подразбиране е 0, ако не е инициализирано -->
        <input type="number" id="pcNumberInput" min="1" value="0">
        
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <button id="applyBtn" class="btn-sync btn-inline">Изпълни</button>
            <button id="cancelBtn" class="btn-inline" style="background-color: #ccc; border: 1px solid #aaa;">Отказ</button>
        </div>
    </div>

    <div class="info-text">
        Работните места трябва да са с различни номера за отчетност.
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const savedIdPC = localStorage.getItem('id_pc') || '0';
    document.getElementById('pcNumberInput').value = savedIdPC;
});

document.getElementById('applyBtn').addEventListener('click', () => {
    const pcNumber = parseInt(document.getElementById('pcNumberInput').value);
    
    if (!pcNumber || pcNumber < 1) {
        alert('Грешка: Номерът на работното място трябва да бъде по-голям от 0!');
        return;
    }

    let oldPC = localStorage.getItem('id_pc') || '0';
    // Записваме в локалния "регистър" на компютъра
    localStorage.setItem('id_pc', pcNumber);
    
    // Пращаме заявка към бакенда с новия номер
    fetch('/api/mysql/log-station', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            eventType: 3, // _CONFIG_PC_NUMBER
            oldPC: oldPC // Пращаме старата стойност към сървъра!
        }) 
    })
    .then(() => {
        window.location.reload(); 
    });
});

// Бутон "Отказ" - връща ни в главното меню, без да ни кара да избираме оператор наново
document.getElementById('cancelBtn').addEventListener('click', () => {
    window.location.href = '../index.html';
});
</script>
</body>
</html>
