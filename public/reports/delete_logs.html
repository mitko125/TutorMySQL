<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Изтриване на отчетите</title>
    <link rel="stylesheet" href="../css/main.css">
    <!-- Зареждаме горното меню, което автоматично ще скрие навигацията за авариен режим -->
    <script src="../js/menu.js"></script>
    <style>
        .delete-box { max-width: 450px; margin: 80px auto; padding: 25px; border: 2px solid #d9534f; background: #fffbfb; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .warning-text { color: #d9534f; font-weight: bold; font-size: 15px; margin-bottom: 20px; line-height: 1.5; text-align: center; }
        .btn-danger { background-color: #d9534f; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-danger:hover { background-color: #c9302c; }
        .btn-secondary { background-color: #ccc; color: #333; border: 1px solid #aaa; padding: 8px 20px; font-weight: bold; cursor: pointer; width: 100%; }
        h3 { margin-top: 0; color: #d9534f; text-align: center; }
    </style>
</head>
<body>

<div class="delete-box">
    <h3>⚠️ КРИТИЧНА ОПЕРАЦИЯ</h3>
    <hr style="border-color: #d9534f; margin-bottom: 20px;">
    
    <div class="warning-text">
        Внимание: Вие сте на път да изтриете НАПЪЛНО и ПЕРМАНЕНТНО всички записи от системния лог на събитията в базата данни!
    </div>

    <!-- Бутоните за действие -->
    <button id="executeDeleteBtn" class="btn-danger">TRUNCATE / ИЗТРИЙ ОТЧЕТИТЕ</button>
    <button id="cancelDeleteBtn" class="btn-secondary">Отказ</button>
</div>

<script>
document.getElementById('executeDeleteBtn').addEventListener('click', () => {
    const firstCheck = confirm("Сигурни ли сте, че искате да ИЗЧИСТИТЕ целия системен лог?");
    if (!firstCheck) return;

    // Вземаме текущия номер на РС от локалния уеб регистър
    const idPC = localStorage.getItem('id_pc') || '0';

    fetch('/api/mysql/delete-logs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // Пращаме го сигурно в JSON пакета към бакенда!
        body: JSON.stringify({ idPC: idPC })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            window.location.href = 'system_log.html';
        } else {
            alert('Грешка при изтриване: ' + data.message);
        }
    });
});

document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
    window.location.href = '../index.html'; // Връщаме го в безопасното главно меню
});
</script>
</body>
</html>
